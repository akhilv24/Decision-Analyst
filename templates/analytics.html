<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - Decision Analyst</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root {
      --bg:       #ffffff;
      --card:     #f8fbff;
      --card2:    #f0f7ff;
      --border:   rgba(0,86,179,0.12);
      --accent:   #0056b3;
      --accent2:  #00a8ff;
      --text:     #1f2937;
      --muted:    #6b7280;
      --success:  #4caf50;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    .header {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 32px; border-bottom:1px solid var(--border);
      background:rgba(255,255,255,0.96); backdrop-filter:blur(12px);
      position:sticky; top:0; z-index:100;
    }
    .logo { display:flex; align-items:center; gap:14px; }
    .logo-icon {
      width:42px; height:42px; border-radius:10px;
      background:linear-gradient(135deg,#10b981,#0056b3);
      display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff;
    }
    .logo-text h1 { font-size:1.2rem; font-weight:700; }
    .logo-text p  { font-size:.6rem; color:var(--muted); letter-spacing:2.5px; margin-top:2px; }
    .nav-links { display:flex; gap:18px; align-items:center; }
    .nav-links a { color:var(--muted); text-decoration:none; transition:color .2s; }
    .nav-links a:hover { color:var(--text); }
    .nav-links a.active { color:var(--accent); font-weight:600; }
    .main { max-width:1340px; margin:0 auto; padding:28px 24px 64px; }
    .section-title {
      display:flex; align-items:center; gap:9px;
      font-size:.7rem; letter-spacing:2px; text-transform:uppercase;
      font-weight:600; margin-bottom:18px;
    }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); }
    .card {
      background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:22px 24px; margin-bottom:20px;
    }
    .card h2 { font-size:1.3rem; margin-bottom:16px; }
    .chart-container {
      position: relative;
      height: 350px;
      margin-bottom: 20px;
    }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .heatmap-table {
      width:100%; border-collapse:collapse;
      margin-top:16px;
    }
    .heatmap-table th, .heatmap-table td {
      padding:10px 12px; border:1px solid var(--border);
      text-align:center; font-size:.85rem;
    }
    .heatmap-table th {
      background:var(--card2); color:var(--accent); font-weight:600;
    }
    .heatmap-table td { background:var(--card2); }
    .loading {
      text-align:center; padding:40px 20px; color:var(--muted);
    }
    .spinner {
      display:inline-block; width:20px; height:20px;
      border:2px solid var(--border); border-top-color:var(--accent);
      border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon"><i class="bi bi-bar-chart"></i></div>
      <div class="logo-text">
        <h1>Decision Analyst</h1>
        <p>ANALYTICS</p>
      </div>
    </div>
    <div class="nav-links">
      <a href="/analytics" class="active"><i class="bi bi-bar-chart"></i> Analytics</a>
      <a href="/settings"><i class="bi bi-gear"></i> Settings</a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main">
    <!-- Monthly Trend Chart -->
    <div class="card">
      <div class="section-title">
        <span class="dot"></span>
        Monthly Spend Trend
      </div>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>

    <!-- Top Vendors & Category Heatmap -->
    <div class="grid-2">
      <!-- Top Vendors Chart -->
      <div class="card">
        <div class="section-title">
          <span class="dot"></span>
          Top 10 Vendors/Clients
        </div>
        <div class="chart-container">
          <canvas id="vendorsChart"></canvas>
        </div>
      </div>

      <!-- Category Heatmap -->
      <div class="card">
        <div class="section-title">
          <span class="dot"></span>
          Category Heatmap (Monthly)
        </div>
        <div id="heatmapContainer"></div>
      </div>
    </div>
  </div>

  <script>
    let trendChart, vendorsChart;
    const colors = {
      text: '#e0e0e0',
      muted: '#8899aa',
      accent: '#00c8ff',
      success: '#00ff88',
      border: 'rgba(0,200,255,0.15)'
    };

    async function loadAnalyticsData() {
      try {
        const response = await fetch('/api/finsight-data');
        const data = await response.json();

        if (!data.success) {
          console.error('Failed to load data');
          return;
        }

        // Monthly Trend
        if (data.trend && data.trend.labels && data.trend.revenue) {
          buildTrendChart(data.trend);
        }

        // Top Vendors
        if (data.overview && data.overview.total_expenses) {
          buildVendorsChart(data);
        }

        // Category Heatmap
        if (data.category_totals) {
          buildHeatmap(data);
        }
      } catch (error) {
        console.error('Error loading analytics:', error);
      }
    }

    function buildTrendChart(trend) {
      const ctx = document.getElementById('trendChart').getContext('2d');
      
      trendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: trend.labels || [],
          datasets: [
            {
              label: 'Revenue',
              data: trend.revenue || [],
              borderColor: '#4caf50',
              backgroundColor: 'rgba(76,175,80,0.1)',
              fill: true,
              tension: 0.3,
              borderWidth: 2,
              pointRadius: 4,
              pointBackgroundColor: '#4caf50',
            },
            {
              label: 'Expenses',
              data: trend.expenses || [],
              borderColor: '#dc2626',
              backgroundColor: 'rgba(220,38,38,0.1)',
              fill: true,
              tension: 0.3,
              borderWidth: 2,
              pointRadius: 4,
              pointBackgroundColor: '#dc2626',
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { 
              labels: { color: '#1f2937', boxWidth: 12, font: { size: 11 } }
            }
          },
          scales: {
            x: { 
              ticks: { color: '#6b7280' },
              grid: { color: 'rgba(0,86,179,0.12)' }
            },
            y: { 
              ticks: { color: '#6b7280' },
              grid: { color: 'rgba(0,86,179,0.12)' }
            }
          }
        }
      });
    }

    function buildVendorsChart(data) {
      // Mock: In production, parse vendor column from data
      const vendors = ['Vendor A', 'Vendor B', 'Vendor C', 'Vendor D', 'Vendor E'];
      const amounts = [
        data.overview.total_expenses * 0.2,
        data.overview.total_expenses * 0.18,
        data.overview.total_expenses * 0.15,
        data.overview.total_expenses * 0.12,
        data.overview.total_expenses * 0.1
      ];

      const ctx = document.getElementById('vendorsChart').getContext('2d');
      vendorsChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: vendors,
          datasets: [{
            label: 'Total Amount',
            data: amounts,
            backgroundColor: 'rgba(0, 86, 179, 0.7)',
            borderColor: '#0056b3',
            borderWidth: 1
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#1f2937' } }
          },
          scales: {
            x: { 
              ticks: { color: '#6b7280' },
              grid: { color: 'rgba(0,86,179,0.12)' }
            },
            y: { 
              ticks: { color: '#6b7280' }
            }
          }
        }
      });
    }

    function buildHeatmap(data) {
      const categories = Object.keys(data.category_totals || {}).slice(0, 8);
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];

      let html = '<table class="heatmap-table"><thead><tr><th>Category</th>';
      months.forEach(m => html += `<th>${m}</th>`);
      html += '</tr></thead><tbody>';

      categories.forEach(cat => {
        html += `<tr><td style="text-align:left;"><strong>${cat}</strong></td>`;
        months.forEach(() => {
          const value = Math.floor(Math.random() * (data.category_totals[cat] || 1000));
          const intensity = Math.min(value / (data.overview.total_expenses / categories.length), 1);
          const bgColor = `rgba(0, 86, 179, ${intensity * 0.5})`;
          html += `<td style="background:${bgColor};">₹${value.toLocaleString()}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table>';

      document.getElementById('heatmapContainer').innerHTML = html;
    }

    window.addEventListener('load', loadAnalyticsData);
  </script>
</body>
</html>
